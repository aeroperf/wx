[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wx"
version = "0.1.0"
description = "Terminal weather, routed to the best regional API (NWS / DWD / met.no)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Michael Vogt"}]
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.scripts]
wx = "wx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["wx"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
